name: Code Quality & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security check
      run: bandit -r scripts/ -ll || true

    - name: Check dependencies for vulnerabilities
      run: safety check --json || true

  documentation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydoc-markdown

    - name: Generate documentation
      run: |
        # Verify all docstrings are present
        python -c "
import scripts.clean_data as cd
import inspect

# Check module docstring
assert cd.__doc__ is not None, 'Module docstring missing'

# Check function docstrings
for name, obj in inspect.getmembers(cd, inspect.isfunction):
    if not name.startswith('_'):
        assert obj.__doc__ is not None, f'Function {name} missing docstring'
        print(f'✓ {name}: documented')
"
